schema: super-sdd

context: |
  - Write artifacts inside the active changeRoot. Resolve durable destinations from planningHome.root
    and archive destinations from planningHome.changesDir in CLI JSON, not the current working directory.
  - openspec/specs/ owns observable behavior; openspec/designs/ owns durable technical design.
    Change-local designs/**/*.md proposes design deltas; tasks.md owns implementation steps.
    Only openspec-sync-designs merges design deltas, before archive. Do not edit durable designs during apply.
  - Use Mermaid for flow, sequence, and state diagrams.
  - Keep artifacts proportional to the change. Remove unused template sections and instructional comments.
    Honor application conventions and explicit user instructions; avoid duplicated content across documents.

operations:
  apply:
    guidance:
      - "Run the design instructions' Design Coverage Check before implementation; read every design file from CLI contextFiles."
      - "Use superpowers:test-driven-development for runtime changes and superpowers:using-git-worktrees when isolation is supported and not already provided."
      - "Use superpowers:requesting-code-review before major-task completion or PR/merge; use superpowers:verification-before-completion for completion claims and superpowers:systematic-debugging for failures."
      - "Even when apply reports all_done, produce fresh verify.md evidence using its instructions before archive; all_done only describes task checkboxes."
      - "Iteration: revise proposal first for scope changes; update affected specs, design documents and the proposal inventory, then tasks. Rerun verification and record deviations."
  archive:
    guidance:
      - "Require exactly one passing Decision: PASS or Decision: PASS WITH WARNINGS line in verify.md. Resolve changeRoot, planningHome, and artifact paths from fresh openspec status --change <id> --json."
      - "Before sync, prepare archive.md in changeRoot with Outcome: not-yet-executed. Get its template from openspec templates --schema super-sdd --json. Record source documents, destinations, validation results, and residual follow-ups from verify.md."
      - "Run openspec-sync-designs synchronously before moving changeRoot. It must reconcile the full inventory, merge all owned destinations, and verify each result or confirm explicit no-impact. Record results before the move; on coverage or sync failure, record failure and stop."
      - "Use openspec-archive-change exactly once to sync specs inline, verify all capabilities, and move changeRoot under planningHome.changesDir/archive/YYYY-MM-DD-<change-id>/. When already inside that workflow, continue it after design sync; do not invoke it recursively. Do not substitute a bare move or also run openspec archive."
      - "Finalize archive.md at the actual reported destination with outcome, date, archive folder, synced capabilities/design files, and follow-ups. If no move occurred, retain the failure record in changeRoot. Check each newly created main spec has a meaningful Purpose without an archive-generated TBD placeholder. Claim success only after checking the archived record and all sync results."
