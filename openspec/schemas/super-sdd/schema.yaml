name: super-sdd
version: 15
description: Adaptive design documents, Superpowers-assisted implementation, and evidence gates

# Use only OpenSpec-supported fields; unknown keys are silently stripped.
# Templates own document structure; instructions own workflow rules. The schema has no shared-context
# or archive-operation field, so shared rules repeat per artifact and design sync before archive is
# wired by a one-line operations.archive.guidance entry in config.yaml naming openspec-sync-designs.
# No artifact is named archive: openspec instructions archive returns operation inputs, never an
# artifact's instruction or template.
artifacts:
  - id: proposal
    generates: proposal.md
    description: Scope, capabilities, and design document inventory
    template: proposal.md
    requires: []
    instruction: |
      Settle why, what, and scope from the user instructions and project context. Record sources read,
      a brief motivation, changes (mark BREAKING), impact, and one provisional intended direction.
      Leave approach comparison to design.
      Shared rules: write only inside changeRoot from CLI JSON and resolve durable paths from
      planningHome.root. Keep the artifact proportional: remove unused template sections and
      instructional comments, honor project conventions and user instructions, and do not repeat
      content another document owns.

      openspec/specs/ owns durable behavior (external, black-box); openspec/designs/ owns durable
      technical design: architecture, API contracts, data model, state machines, event contracts,
      caching and retry, security model, deployment topology, algorithms, migration approach. The list
      is open. Capabilities record behavior changes; Design Documents record the rest.

      Capabilities: name each exact delta path, specs/<capability-path>/spec.md. Follow the existing
      durable layout; use kebab-case for new segments and allow nesting. Name a new capability for a
      durable system behavior (user-auth), not this change's work (add-login-endpoint). Confirm
      existing paths with openspec list --specs, and read related ones in full with openspec show
      "<spec-id>" --type spec; reuse an existing path rather than add a near-duplicate. A modified
      capability must already exist under <planningHome.root>/openspec/specs/; otherwise it is new.
      For no behavioral change, explain why and set skip_specs: true in <changeRoot>/.openspec.yaml.
      Do not invent specs.

      Design Documents: list each planned designs/<topic>.md, its purpose, and durable destinations
      (openspec/designs/... paths, or none). Choose the smallest useful set from the user's instructions,
      target application, existing designs, and change scope. Use descriptive kebab-case names and
      application subdirectories when helpful; do not impose fixed document types. One document may
      own several durable targets, but each target has exactly one owning document in this change. A small or no-impact change can use only
      designs/overview.md. This inventory is the coverage contract, not a separate manifest.

      Done when scope is clear, every capability has a path or specs are explicitly skipped, and at
      least one design document is inventoried. Revise the inventory if design exploration changes it.

  - id: specs
    generates: "specs/**/*.md"
    description: Observable requirements and scenarios, one delta per capability
    template: spec.md
    requires: [proposal]
    instruction: |
      Write one delta per inventoried capability at specs/<capability-path>/spec.md. Describe externally
      observable behavior; put technical choices in designs/ and execution steps in tasks.md.
      Shared rules: write only inside changeRoot from CLI JSON and resolve durable paths from
      planningHome.root. Keep the artifact proportional: remove unused template sections and
      instructional comments, honor project conventions and user instructions, and do not repeat
      content another document owns.
      If skip_specs is set, create no spec files. Write the files one at a time: start with the first
      inventoried capability that has no file, write each as soon as it is drafted, and do not rewrite
      an existing file unless asked.

      Use only needed operation sections: ADDED, MODIFIED, REMOVED, RENAMED Requirements.
      Every ADDED/MODIFIED requirement needs a SHALL or MUST in its body and at least one non-fenced
      #### Scenario: heading with WHEN/THEN bullets. A keyword only in the requirement title is invalid.
      Keep each ADDED requirement's description (text before its first scenario) at 500 characters or
      fewer; --strict validation fails a longer one. State one behavior per requirement, move examples
      and edge cases into scenarios, and split a multi-behavior requirement. Never split or trim a
      MODIFIED requirement just to meet the limit.
      For MODIFIED, copy the entire existing requirement including every scenario from
      <planningHome.root>/openspec/specs/<capability-path>/spec.md, then edit it. Preserve its name
      (whitespace-insensitive); omitted scenarios are lost at sync. Use ADDED for a new concern.
      REMOVED entries need Reason and Migration; RENAMED entries use FROM:/TO: names.

      New capabilities only: include a meaningful ## Purpose of at least 50 characters; sync copies it
      into the durable spec. Existing capabilities already have a Purpose, so omit it from their deltas.
      If removal empties a capability, set retire_capabilities: true in <changeRoot>/.openspec.yaml.

      Done when all inventoried deltas satisfy this grammar and unused operation sections are removed.

  - id: design
    generates: "designs/**/*.md"
    description: Application-appropriate design documents and durable deltas
    template: design.md
    requires: [specs]
    instruction: |
      Required skill: superpowers:brainstorming. Invoke it using the platform's skill mechanism.
      If unavailable, stop and report that it must be enabled for this project; do not improvise a substitute.

      Read proposal.md, applicable specs, existing durable designs, and user instructions. Choose and
      justify the implementation approach within scope. Revise proposal/specs first if scope or behavior
      changes. Refine the proposal's Design Documents inventory as needed, then create every listed file
      under designs/, applying this template separately to each. Keep the smallest useful set; do not
      generate a catalog of documents merely because the application could have them.
      Shared rules: write only inside changeRoot from CLI JSON and resolve durable paths from
      planningHome.root. Keep the artifact proportional: remove unused template sections and
      instructional comments, honor project conventions and user instructions, and do not repeat
      content another document owns.

      Write durable content with the design-docs skill: its template per document kind, its writing
      rules, and its ste-lint (--kind <kind>) on every durable document touched. Add each new durable
      document to openspec/designs/README.md. State self-contained constraints without PRD citations or
      unexplained requirement IDs. Body sections state rules; reasons and rejected alternatives go in
      ## Decisions. Preserve decisions, invariants, tradeoffs, recovery paths and validation caveats, and
      mark which mechanisms are implemented, planned or open. These rules cover durable content only;
      CONTEXT and the routing wrappers below stay as this schema requires.
      Diagrams follow the technical-diagrams skill: Mermaid inline for sequence, ER and state diagrams
      only; an editable .drawio.svg in diagrams/ beside the document for every flowchart, architecture,
      topology and dependency map. No ASCII-art boxes, inline arrow chains or PNG/JPEG.

      Each document contains ## CONTEXT: its chosen approach, alternatives considered, and rationale.
      Keep it brief for simple changes. Cross-reference other documents instead of repeating decisions.
      Then add one ## Durable Design: <openspec/designs/...> section per owned destination, using only
      needed ### ADDED / MODIFIED / REMOVED subsections. Supply durable content, not implementation tasks.
      For MODIFIED/REMOVED, identify the exact existing heading (or natural key for structured formats).
      If this document owns no durable destination, write No durable design impact. after CONTEXT.
      Never combine that marker with durable delta sections in the same document.

      DESIGN COVERAGE CHECK (before tasks, apply, verification approval, and sync):
      Compare the proposal inventory to artifactPaths.design.existingOutputPaths from status JSON.
      Read every file: resolve missing/unlisted files, unfinished placeholders, broken local design links,
      absent or undeclared target sections, duplicate target ownership, and contradictory no-impact markers.
      Each inventoried target must have one nonempty delta section; a document with no target must have
      the explicit no-impact marker.
      Stop the next phase until mismatches are resolved. OpenSpec marks this glob done after ONE file
      exists; status and structural validation do not establish full coverage or content correctness.

      Done when the full set passes coverage, each approach is explained, and each durable delta is
      ready for openspec-sync-designs. That skill merges deltas before archive; OpenSpec does not sync designs.

  - id: tasks
    generates: tasks.md
    description: Implementation checklist, execution steps, and validation
    template: tasks.md
    requires: [specs, design]
    instruction: |
      Required skill: superpowers:writing-plans. Invoke it using the platform's skill mechanism.
      If unavailable, stop and report that it must be enabled for this project; do not improvise a substitute.

      Fetch openspec instructions design --change <id> --json and run its Design Coverage Check
      against every reported design file before writing tasks.
      tasks.md is the change-local plan only: file list, checklist and execution steps. Reference the
      relevant design paths; do not repeat durable design or its rationale.
      Shared rules: write only inside changeRoot from CLI JSON and resolve durable paths from
      planningHome.root. Keep the artifact proportional: remove unused template sections and
      instructional comments, honor project conventions and user instructions, and do not repeat
      content another document owns.
      Write exactly one Scope: runtime or Scope: no-runtime line at column 1. Runtime means production
      behavior changes; no-runtime covers schema, config, specs, or docs only.

      List concrete files, operations, and purposes. Checklist groups use ## N. <name>, with unique
      - [ ] N.M task IDs matching the group. Each task states its completion check. These are the only
      checkboxes anywhere in tasks.md because apply counts every checkbox; custom schemas do not get
      the CLI's task-numbering warnings.
      Each group lands the tests and documentation its own work calls for; never collect them into
      a final group, which is for cross-group integration checks only.
      Give each checklist task execution steps with exact files and commands, sized around 2-5 minutes.
      Use RED/GREEN/REFACTOR for runtime changes; explicitly label no-runtime steps where TDD does not apply.
      Record validation commands and review checkpoints; include recovery and deferred items when relevant.
      A deferral must state why it does not compromise accepted specs/designs and who or what follows up.

      Done when coverage passes and every task has executable steps, a completion check, and required review.

  - id: verify
    generates: verify.md
    description: Fresh validation evidence, consistency, and sync readiness
    template: verify.md
    requires: [tasks]
    instruction: |
      Required skill: superpowers:verification-before-completion. Invoke it using the platform's skill mechanism.
      If unavailable, stop and report that it must be enabled for this project; do not improvise a substitute.

      Write after implementation tasks are complete or safely deferred; overwrite on each fresh run.
      Shared rules: write only inside changeRoot from CLI JSON and resolve durable paths from
      planningHome.root. Keep the artifact proportional: remove unused template sections and
      instructional comments, honor project conventions and user instructions, and do not repeat
      content another document owns.
      Precheck from the implementation repo root:
        BASE=$(git merge-base HEAD origin/main 2>/dev/null || git merge-base HEAD origin/master 2>/dev/null || git merge-base HEAD main 2>/dev/null || git merge-base HEAD master 2>/dev/null || git rev-parse HEAD~1)
        test "$(grep -cE '^Scope: (runtime|no-runtime)$' <changeRoot>/tasks.md)" -eq 1
        test "$(git log --oneline "$BASE"..HEAD | wc -l | tr -d ' ')" -gt 0
      Runtime additionally requires at least one completed checklist task.

      Fetch openspec instructions design --change <id> --json and run its Design Coverage Check;
      record expected and actual files and any mismatches. A coverage failure blocks approval even if
      OpenSpec reports design done.
      Run openspec validate <change-id> --type change --strict --json, and openspec schema validate
      super-sdd --verbose if the schema changed. Capture fresh evidence for every promised validation
      command, or an explicit not-applicable rationale. Record task completion and each non-blocking deferral.
      Record spec sync state per capability and design sync state per source document/durable target:
      will-sync / already-manually-synced / not-applicable. No-impact documents still get a row.
      Include date, implementation range <BASE>..<HEAD>, deviations, residual risks, and useful lessons;
      use a brief None rationale when empty.

      End with exactly one column-1 Decision: PASS, Decision: PASS WITH WARNINGS, or Decision: FAIL line.
      Approval requires all blocking checks to pass. On failure use superpowers:systematic-debugging and
      return to apply; do not archive until the decision permits it.

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Required skill: superpowers:subagent-driven-development. Invoke it using the platform's skill mechanism.
    If unavailable, stop and report that it must be enabled for this project; do not fall back to serial execution.

    Before implementation, fetch openspec instructions design --change <id> --json and run its Design
    Coverage Check using fresh status JSON. Read every file in contextFiles, including all design files.
    Resolve coverage failures before executing tasks, regardless of the CLI's ready/done status.
    Complete the checklist with a fresh implementer per task and spec-compliance then code-quality review.
    Use superpowers:test-driven-development for runtime changes, and superpowers:using-git-worktrees
    when the platform supports isolation and none is already provided. Use
    superpowers:requesting-code-review before completing a major task or opening a PR or merge,
    superpowers:verification-before-completion for completion claims, and superpowers:systematic-debugging
    for failures. Never edit openspec/designs/ during apply; the change's designs/ deltas merge at archive.

    Iteration: revise the proposal first for scope changes, then the affected specs, design documents
    and proposal inventory, then tasks. Rerun verification and record deviations.

    When tasks are complete or safely deferred, write fresh verify.md evidence with its instructions,
    even when apply reports all_done: that state only describes task checkboxes. Archive with
    openspec-archive-change only after verification approval; its operation guidance runs
    openspec-sync-designs before the spec sync and move.
